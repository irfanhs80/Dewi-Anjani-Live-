
name: Build Dewi Anjani Live Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and Sign Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android SDK Packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android Project
        run: |
          if [ ! -f settings.gradle.kts ] && \
             [ ! -f settings.gradle ]; then
            echo "ERROR: File settings.gradle tidak ditemukan."
            exit 1
          fi

          if [ ! -f app/build.gradle.kts ] && \
             [ ! -f app/build.gradle ]; then
            echo "ERROR: File app/build.gradle tidak ditemukan."
            exit 1
          fi

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: Secret ANDROID_KEYSTORE_BASE64 belum diatur."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/release.jks"

          test -s "$RUNNER_TEMP/release.jks"

      - name: Build Release APK
        run: |
          gradle --no-daemon assembleRelease

      - name: Find and Sign Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          APK=$(find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            ! -name '*-androidTest.apk' \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK Release tidak ditemukan."
            exit 1
          fi

          mkdir -p dist

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out dist/app-release.apk \
            "$APK"

      - name: Verify Signed APK
        run: |
          set -e

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose --print-certs \
            dist/app-release.apk

          echo "APK Release berhasil ditandatangani."

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Dewi-Anjani-Live-Release
          path: dist/app-release.apk
          if-no-files-found: error
          retention-days: 14
