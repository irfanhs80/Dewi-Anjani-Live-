
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      
      - name: Build APK
        run: |
          GRADLEW_PATH=$(find . -type f -name gradlew -not -path './.git/*' -print -quit)

          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: File gradlew tidak ditemukan."
            echo "Periksa apakah proyek Android sudah diekstrak ke repository."
            exit 1
          fi

          echo "Gradle wrapper ditemukan: $GRADLEW_PATH"

          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJECT_DIR"

          chmod +x ./gradlew
          ./gradlew assembleDebug


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dewi-Anjani-Live-debug
          path: app/build/outputs/apk/debug/app-debug.apk
