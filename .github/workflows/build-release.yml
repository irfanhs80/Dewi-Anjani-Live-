
name: Build Dewi Anjani Live Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify ZIP source
        run: |
          test -f source.zip || {
            echo "ERROR: source.zip tidak ditemukan."
            exit 1
          }

      - name: Extract Android project
        run: |
          mkdir -p "$RUNNER_TEMP/android-source"

          unzip -q source.zip \
            -d "$RUNNER_TEMP/android-source"

          SETTINGS_FILE=$(find "$RUNNER_TEMP/android-source" \
            -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: File settings.gradle tidak ditemukan."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan."
            exit 1
          fi

          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --licenses

          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android project
        run: |
          cd "$PROJECT_DIR"

          test -d app || {
            echo "ERROR: Folder app tidak ditemukan."
            exit 1
          }

          if [ ! -f app/build.gradle.kts ] && \
             [ ! -f app/build.gradle ]; then
            echo "ERROR: File Gradle aplikasi tidak ditemukan."
            exit 1
          fi

          echo "Struktur proyek valid."

      - name: Build Release APK
        run: |
          cd "$PROJECT_DIR"

          gradle --no-daemon \
            --stacktrace \
            assembleRelease

      - name: Verify Release APK
        run: |
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK release tidak ditemukan."
            exit 1
          fi

          echo "APK berhasil dibuat: $APK"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Dewi-Anjani-Live-Release
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
