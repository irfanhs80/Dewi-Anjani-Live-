name: Build Dewi Anjani Live Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail
          # Upload the Android project ZIP to the repository root with this exact name.
          ZIP_PATH="source.zip"
          if [[ ! -f "$ZIP_PATH" ]]; then
            echo "ERROR: source.zip tidak ditemukan di root repository. Upload paket proyek Android sebagai source.zip."
            exit 1
          fi

          rm -rf _project
          mkdir -p _project
          unzip -q "$ZIP_PATH" -d _project

          # Support ZIPs containing the project directly or inside one/more parent folders.
          mapfile -t SETTINGS_FILES < <(find _project -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print)
          if [[ ${#SETTINGS_FILES[@]} -ne 1 ]]; then
            echo "ERROR: ZIP harus berisi tepat satu settings.gradle(.kts); ditemukan ${#SETTINGS_FILES[@]}."
            exit 1
          fi
          PROJECT_ROOT="$(dirname "${SETTINGS_FILES[0]}")"

          test -f "$PROJECT_ROOT/build.gradle.kts" -o -f "$PROJECT_ROOT/build.gradle" || {
            echo "ERROR: build.gradle(.kts) tidak ditemukan pada root proyek."; exit 1;
          }
          test -f "$PROJECT_ROOT/app/build.gradle.kts" -o -f "$PROJECT_ROOT/app/build.gradle" || {
            echo "ERROR: app/build.gradle(.kts) tidak ditemukan."; exit 1;
          }

          # Extract into a clean directory; do not accidentally build stale files from the repository.
          rm -rf android-project
          mkdir -p android-project
          cp -a "$PROJECT_ROOT"/. android-project/
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/android-project" >> "$GITHUB_ENV"

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project and toolchain
        working-directory: android-project
        shell: bash
        run: |
          set -euo pipefail
          echo "Project root: $(pwd)"
          grep -R -nE 'com\.android\.application.*version|com.android.tools.build:gradle' --include='*.gradle' --include='*.gradle.kts' . || true
          test -f settings.gradle.kts -o -f settings.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Build Release APK
        working-directory: android-project
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace assembleRelease
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [[ -z "$APK" ]]; then
            echo "ERROR: APK release tidak ditemukan."; exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$APK" "$GITHUB_WORKSPACE/release/Dewi-Anjani-Live-release-unsigned.apk"

      - name: Sign APK for installation
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$SDK/build-tools/35.0.0/apksigner"
          KEYSTORE="$RUNNER_TEMP/dewi-release.jks"

          # Temporary key makes this APK installable. It is NOT suitable for updating an
          # already-installed release signed with a different key. Use a persistent secret key for production.
          "$JAVA_HOME/bin/keytool" -genkeypair -noprompt \
            -keystore "$KEYSTORE" -storepass changeit -keypass changeit \
            -alias release -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Dewi Anjani Live, OU=Radio, O=Dewi Anjani, L=Anjani, ST=NTB, C=ID"

          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass pass:changeit \
            --key-pass pass:changeit --ks-key-alias release \
            --out release/Dewi-Anjani-Live-release.apk \
            release/Dewi-Anjani-Live-release-unsigned.apk
          "$APKSIGNER" verify --verbose release/Dewi-Anjani-Live-release.apk

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dewi-Anjani-Live-Release
          path: release/Dewi-Anjani-Live-release.apk
          if-no-files-found: error
          retention-days: 14
