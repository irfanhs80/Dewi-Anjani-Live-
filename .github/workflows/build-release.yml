
name: Build Dewi Anjani Live Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP source
        run: |
          if [ ! -f source.zip ]; then
            echo "File source.zip tidak ditemukan di root repository."
            exit 1
          fi

      - name: Extract Android project
        run: |
          mkdir -p "$RUNNER_TEMP/android-source"

          unzip -q source.zip -d "$RUNNER_TEMP/android-source"

          SETTINGS_FILE=$(find "$RUNNER_TEMP/android-source" \
            -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "File settings.gradle atau settings.gradle.kts tidak ditemukan."
            echo "Periksa isi source.zip."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Proyek Android ditemukan di: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

          yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android project
        run: |
          cd "$PROJECT_DIR"

          if [ ! -d app ]; then
            echo "Folder app tidak ditemukan."
            exit 1
          fi

          if [ ! -f app/build.gradle.kts ] && \
             [ ! -f app/build.gradle ]; then
            echo "File Gradle aplikasi tidak ditemukan."
            exit 1
          fi

          echo "Struktur proyek Android ditemukan."

      - name: Build Release APK
        run: |
          cd "$PROJECT_DIR"

          gradle --no-daemon \
            --stacktrace \
            assembleRelease

      - name: Verify Release APK
        run: |
          cd "$PROJECT_DIR"

          APK=$(find app/build/outputs/apk/release \
            -type f -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "APK release tidak ditemukan."
            exit 1
          fi

          echo "APK berhasil dibuat: $APK"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Dewi-Anjani-Live-Release
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
