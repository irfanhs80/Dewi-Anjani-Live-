name: Build Dewi Anjani Live Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH=""
          if [[ -f source.zip ]]; then ZIP_PATH="source.zip"
          else
            ZIP_PATH="$(find . -maxdepth 2 -type f -iname '*.zip' ! -path './.git/*' | head -n 1 || true)"
          fi
          if [[ -n "$ZIP_PATH" ]]; then
            mkdir -p _project
            unzip -q "$ZIP_PATH" -d _project
            ROOT="$(find _project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)"
            if [[ -z "$ROOT" ]]; then
              echo "ZIP tidak berisi settings.gradle atau settings.gradle.kts"
              exit 1
            fi
            cp -a "$ROOT"/. .
          fi
          if [[ ! -f settings.gradle.kts && ! -f settings.gradle ]]; then
            echo "Tidak ditemukan proyek Android di root atau ZIP."
            exit 1
          fi
          if [[ ! -f app/build.gradle.kts && ! -f app/build.gradle ]]; then
            echo "Tidak ditemukan app/build.gradle(.kts)."
            exit 1
          fi

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -perm -u+x | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace assembleRelease
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' | head -n 1)"
          if [[ -z "$APK" ]]; then
            APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          fi
          test -n "$APK"
          mkdir -p release
          cp "$APK" release/Dewi-Anjani-Live-release-unsigned.apk

      - name: Create temporary signing key and sign APK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$SDK/build-tools/35.0.0/apksigner"
          KEYTOOL="$JAVA_HOME/bin/keytool"
          "$KEYTOOL" -genkeypair -v -keystore "$RUNNER_TEMP/release-keystore.jks" \
            -storepass changeit -keypass changeit -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Dewi Anjani Live, OU=Radio, O=Dewi Anjani, L=Anjani, ST=NTB, C=ID"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/release-keystore.jks" \
            --ks-pass pass:changeit --key-pass pass:changeit --ks-key-alias release \
            --out release/Dewi-Anjani-Live-release.apk \
            release/Dewi-Anjani-Live-release-unsigned.apk
          "$APKSIGNER" verify --verbose --print-certs release/Dewi-Anjani-Live-release.apk

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Dewi-Anjani-Live-Release
          path: release/Dewi-Anjani-Live-release.apk
          if-no-files-found: error
          retention-days: 14
